# HTTPS virtual server for the static website.
server {
    listen       443 ssl;
    server_name  _;

    # TLS files are mounted read-only from deploy/fullchain.pem and
    # deploy/privkey.pem by docker-compose.yml.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # When site-maintenance exists, redirect every public request except the
    # status page and assets needed to render it.
    if (-f /var/www/site/site-maintenance) {
        rewrite ^(?!/(status|status\.html|status-state|assets/site\.css)$) /status redirect;
    }

    # The Docker image copies public/ into /usr/share/nginx/html.
    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers are included on every response.
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Compress text assets that benefit from gzip.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_types text/css application/javascript;

    # Disable caching for HTML and dynamic status content.
    location = /index.html {
        expires -1;
    }

    location = /resume.html {
        expires -1;
    }

    location = /assets/site.css {
        expires -1;
    }

    location = /status.html {
        expires -1;
    }

    # Report the maintenance flag as plain text for status.html's fetch().
    location = /status-state {
        default_type text/plain;
        expires -1;
        root /var/www/site;
        try_files /site-maintenance @site-online;
    }

    # This named location is used when site-maintenance is absent.
    location @site-online {
        default_type text/plain;
        expires -1;
        return 200 "online";
    }

    # Serve a branded page for missing routes.
    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
        expires -1;
    }

    location = /404 {
        return 404;
    }

    # The resume page is only available at /resume.html.
    location = /resume {
        return 404;
    }

    # Preserve clean extensionless URLs: /page is redirected once to /page.html
    # when public/page.html exists. Otherwise, try the real file or directory.
    location / {
        if (-f $request_filename.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri/ =404;
    }

    # Never expose dotfiles or allow directory access to hidden files.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

}
