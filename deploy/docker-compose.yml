services:
  website:
    build:
      context: ..
      dockerfile: deploy/dockerfile
    container_name: website
    ports:
      - "443:443"
    volumes:
      - ./fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - ../:/var/www/site:ro
    restart: unless-stopped
