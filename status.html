<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Status | marcopulv</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=grid-3x2">
</head>

<body>
  <main class="page">
    <div class="card" id="site-status" role="status" aria-live="polite">
      <div class="card-icon" id="status-icon" style="--brand-color: #737373; --brand-bg: #f0f0f0;" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path id="status-symbol" d="M12 7v6m0 4h.01" />
        </svg>
      </div>
      <div class="card-info">
        <span class="card-name" id="status-title">Checking site status</span>
        <span class="card-handle" id="status-message">Please wait.</span>
      </div>
    </div>

    <a id="status-home" href="/" class="home-banner" hidden>
      <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
      </svg>
      <span class="home-text">Go to homepage</span>
    </a>
  </main>

  <footer class="site-footer">
    <span>marcopulv</span><br>
    <span>HTML5 &middot; CSS3 &middot; JavaScript (ES2015+) &middot; SVG &middot; Inter / Google Fonts &middot; Markdown</span><br>
    <span>Docker 29.5.3 &middot; Docker Compose 5.1.4 &middot; Nginx 1.27.5 &middot; Alpine Linux 3.21.3</span><br>
    <span>Debian 13 &middot; Hostinger VPS KVM 1</span><br>
    <span>YAML &middot; TLS 1.2/1.3 &middot; Let&apos;s Encrypt &middot; acme.sh &middot; cron</span>
  </footer>
  <script src="/status.js" defer></script>
</body>

</html>
