server {
    listen       443 ssl;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Keep the status route, state endpoint, script, and styles reachable while offline.
        if (-f /var/www/site/site-offline) {
        rewrite ^(?!/(status|status\.html|status-state|status\.js|style\.css)$) /status redirect;
    }

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_types text/css application/javascript;

    location = /index.html {
        expires -1;
    }

    location = /style.css {
        expires -1;
    }

    location = /status.js {
        expires -1;
    }

    location = /status.html {
        expires -1;
    }

    location = /status-state {
        default_type text/plain;
        expires -1;
        root /var/www/site;
        try_files /site-offline @site-online;
    }

    location @site-online {
        default_type text/plain;
        expires -1;
        return 200 "online";
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
        expires -1;
    }

    location = /404 {
        return 404;
    }

    location / {
        if (-f $request_filename.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri/ =404;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

}
